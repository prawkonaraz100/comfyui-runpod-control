name: RunPod power

on:
  workflow_dispatch:
    inputs:
      action:
        description: RunPod power operation
        required: true
        type: choice
        options:
          - status
          - start
          - stop
          - restart
  push:
    branches:
      - main
    paths:
      - control/power.json

permissions:
  contents: read

concurrency:
  group: runpod-power-control
  cancel-in-progress: false

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve action
        id: command
        shell: bash
        env:
          DISPATCH_ACTION: ${{ inputs.action }}
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ACTION="$DISPATCH_ACTION"
          else
            ACTION="$(python3 -c 'import json; print(json.load(open("control/power.json", encoding="utf-8"))["action"])')"
          fi
          case "$ACTION" in
            status|start|stop|restart) ;;
            *) echo "Unknown action: $ACTION" >&2; exit 64 ;;
          esac
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Call RunPod REST API
        shell: bash
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_ID: ${{ secrets.RUNPOD_POD_ID }}
          ACTION: ${{ steps.command.outputs.action }}
        run: |
          set -Eeuo pipefail
          [[ -n "$RUNPOD_API_KEY" ]] || { echo "Missing RUNPOD_API_KEY" >&2; exit 2; }
          [[ -n "$RUNPOD_POD_ID" ]] || { echo "Missing RUNPOD_POD_ID" >&2; exit 2; }
          BASE="https://rest.runpod.io/v1/pods/$RUNPOD_POD_ID"
          case "$ACTION" in
            status) METHOD=GET; URL="$BASE" ;;
            start) METHOD=POST; URL="$BASE/start" ;;
            stop) METHOD=POST; URL="$BASE/stop" ;;
            restart) METHOD=POST; URL="$BASE/restart" ;;
          esac
          echo "RunPod action: $ACTION"
          RESPONSE="$(curl -fsS --retry 3 --retry-delay 2 -X "$METHOD" -H "Authorization: Bearer $RUNPOD_API_KEY" -H "Accept: application/json" "$URL")"
          if [[ -n "$RESPONSE" ]]; then
            python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), indent=2))' <<<"$RESPONSE" || printf '%s\n' "$RESPONSE"
          fi
