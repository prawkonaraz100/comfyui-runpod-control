name: RunPod power

on:
  workflow_dispatch:
    inputs:
      action:
        description: RunPod power operation
        required: true
        type: choice
        options:
          - status
          - start
          - stop
          - restart
  push:
    branches:
      - main
    paths:
      - control/power.json

permissions:
  contents: read

concurrency:
  group: runpod-power-control
  cancel-in-progress: false

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_POD_ID: ${{ secrets.RUNPOD_POD_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve command
        id: command
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ACTION="${{ inputs.action }}"
          else
            ACTION="$(python3 - <<'PY'
import json
with open("control/power.json", "r", encoding="utf-8") as f:
    print(json.load(f)["action"])
PY
)"
          fi
          case "$ACTION" in
            status|start|stop|restart) ;;
            *) echo "Unknown action: $ACTION" >&2; exit 64 ;;
          esac
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$RUNPOD_API_KEY" ]] || { echo "Missing RUNPOD_API_KEY repository secret"; exit 2; }
          [[ -n "$RUNPOD_POD_ID" ]] || { echo "Missing RUNPOD_POD_ID repository secret"; exit 2; }

      - name: Call RunPod REST API
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTION="${{ steps.command.outputs.action }}"
          BASE="https://rest.runpod.io/v1/pods/$RUNPOD_POD_ID"

          case "$ACTION" in
            status)
              METHOD="GET"
              URL="$BASE"
              ;;
            start)
              METHOD="POST"
              URL="$BASE/start"
              ;;
            stop)
              METHOD="POST"
              URL="$BASE/stop"
              ;;
            restart)
              METHOD="POST"
              URL="$BASE/restart"
              ;;
          esac

          echo "RunPod action: $ACTION"
          echo "Pod ID: ${RUNPOD_POD_ID:0:4}... (redacted)"
          RESPONSE="$(curl -fsS --retry 3 --retry-delay 2             -X "$METHOD"             -H "Authorization: Bearer $RUNPOD_API_KEY"             -H "Accept: application/json"             "$URL")"

          if [[ -n "$RESPONSE" ]]; then
            python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), indent=2))' <<<"$RESPONSE"               || printf '%s\n' "$RESPONSE"
          else
            echo "RunPod API returned success with an empty body."
          fi
