name: Faceless Quality Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/chatgpt-faceless-engine-v1
    paths:
      - "faceless/**"
      - ".agents/skills/faceless-video-director/**"
      - ".agents/skills/faceless-video-director/**"
      - "scripts/faceless_validate.py"
      - "tests/test_faceless_contract.py"
      - "tests/test_faceless_skill.py"
      - "tests/test_faceless_skill.py"
      - "docs/FACELESS_WORKFLOW_V1.md"
      - ".github/workflows/faceless-quality.yml"
  pull_request:
    paths:
      - "faceless/**"
      - "scripts/faceless_validate.py"
      - "tests/test_faceless_contract.py"
      - "docs/FACELESS_WORKFLOW_V1.md"
      - ".github/workflows/faceless-quality.yml"

permissions:
  contents: read

concurrency:
  group: faceless-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_faceless_*.py" -v

      - name: Validate proposal demo
        run: python scripts/faceless_validate.py faceless/projects/demo

      - name: Validate style-frame demo
        run: python scripts/faceless_validate.py faceless/projects/style-frame-demo
